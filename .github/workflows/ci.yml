# Build and test on every push to main and every pull request. Also builds the Linux packages,
# so a broken packaging definition shows up here and not at release time.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build

  packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the portable archive and the packages
        run: |
          ./gradlew :app:createDistributable
          version=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          tar -czf "MineCartographer-$version-linux-x64.tar.gz" \
            -C app/build/compose/binaries/main/app MineCartographer
          sh packaging/build-packages.sh "$version" amd64 "MineCartographer-$version-linux-x64.tar.gz" dist

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          if-no-files-found: error
          path: dist/*
