# Builds the installers (each bundles its own Java runtime) and attaches them to a release.
# Runs on a pushed tag like v0.5.0-alpha. The "-alpha" suffix stays in the tag and is ignored for the logic:
#   vX.Y.0[-alpha]  full release: a DRAFT (publish it by hand after reading the notes), marked Latest
#   vX.Y.Z[-alpha]  (Z > 0) nightly: published at once as a pre-release
# The tag must equal appVersion in gradle.properties. Notes come from the commit messages.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual run: builds everything as workflow artifacts, no release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runners, so the bundled runtime runs on older glibc too.
          - { name: linux-x64,   os: ubuntu-22.04,     kind: linux }
          - { name: linux-arm64, os: ubuntu-22.04-arm, kind: linux }
          - { name: macos-arm64, os: macos-latest,     kind: macos }
          - { name: macos-x64,   os: macos-15-intel,   kind: macos }
          - { name: windows,     os: windows-latest,   kind: windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Check that the tag matches appVersion
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match appVersion=$version in gradle.properties"
            exit 1
          fi

      # The Linux archive also feeds the .deb/.rpm/Arch packages (job "packages").
      - name: Build the portable Linux archive
        if: matrix.kind == 'linux'
        run: |
          ./gradlew :app:createDistributable
          version=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          mkdir out
          tar -czf "out/MineCartographer-$version-${{ matrix.name }}.tar.gz" \
            -C app/build/compose/binaries/main/app MineCartographer

      - name: Build the DMG (unsigned)
        if: matrix.kind == 'macos'
        run: |
          ./gradlew :app:packageDmg
          version=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          mkdir out
          cp app/build/compose/binaries/main/dmg/*.dmg "out/MineCartographer-$version-${{ matrix.name }}.dmg"

      - name: Build the MSI
        if: matrix.kind == 'windows'
        run: |
          ./gradlew :app:packageMsi
          mkdir out
          cp app/build/compose/binaries/main/msi/*.msi out/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: out/*

  # One nfpm definition (packaging/nfpm.yaml) -> .deb, .rpm and Arch package, per CPU.
  packages:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: linux-x64,   arch: amd64 }
          - { name: linux-arm64, arch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.name }}
          path: in

      - name: Build the packages
        run: |
          version=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          sh packaging/build-packages.sh "$version" ${{ matrix.arch }} in/*.tar.gz dist

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/*

  release:
    needs: [build, packages]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the notes need the full history and the tags

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          sh .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          # Full release = X.Y.0 (any -alpha suffix is ignored), otherwise a nightly.
          base=${GITHUB_REF_NAME#v}; base=${base%%-*}
          case "$base" in
            *.*.0) flags="--draft --latest" ;;
            *)     flags="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md $flags
